<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailScan AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">
            📧 MailScan AI
        </h1>
        <p class="text-info">
            AI-Powered Email Screenshot Scanner
        </p>
    </div>

    <div class="card p-4 shadow-lg">

        <label class="form-label">
            Upload Email Screenshot
        </label>

        <input
            type="file"
            id="imageInput"
            class="form-control"
            accept="image/*">

        <img
            id="preview"
            class="preview-image mt-4"
            style="display:none;">

        <button
            class="btn btn-primary btn-lg mt-4"
            onclick="uploadImage()">

            Analyze Email

        </button>

        <div
            id="loading"
            class="text-center mt-5 d-none">

            <div
                class="spinner-border text-primary"
                style="width:4rem;height:4rem">
            </div>

            <h4
                id="loadingText"
                class="mt-3 text-info">

                Reading Email...

            </h4>

        </div>

        <div id="result" class="mt-5"></div>

    </div>

</div>

<script>

const loadingMessages = [
    "Reading Email Screenshot...",
    "Extracting Text...",
    "Running OCR...",
    "Analyzing Content...",
    "Detecting Threats...",
    "Calculating AI Confidence..."
];

let messageIndex = 0;

setInterval(() => {

    const loadingText =
        document.getElementById("loadingText");

    if (loadingText) {

        loadingText.innerText =
            loadingMessages[messageIndex];

        messageIndex =
            (messageIndex + 1) %
            loadingMessages.length;
    }

}, 1500);


document
.getElementById("imageInput")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const preview =
            document.getElementById("preview");

        preview.src = e.target.result;
        preview.style.display = "block";
    }

    reader.readAsDataURL(file);

});


async function uploadImage(){

    const fileInput =
        document.getElementById("imageInput");

    if(fileInput.files.length === 0){

        alert("Please select an image.");

        return;
    }

    const formData = new FormData();

    formData.append(
        "image",
        fileInput.files[0]
    );

    document
        .getElementById("loading")
        .classList.remove("d-none");

    document
        .getElementById("result")
        .innerHTML = "";

    try{

        const response =
            await fetch("/classify", {
                method: "POST",
                body: formData
            });

        const data =
            await response.json();

        document
            .getElementById("loading")
            .classList.add("d-none");

        if(data.error){

            alert(data.error);

            return;
        }

        let emoji = "👤";
        let alertClass = "success";

        if(data.label === "Spam"){

            emoji = "🚨";
            alertClass = "danger";
        }

        if(data.label === "Phishing"){

            emoji = "⚠️";
            alertClass = "warning";
        }

        if(data.label === "Business"){

            emoji = "💼";
            alertClass = "primary";
        }

        let html = `
            <div class="alert alert-${alertClass} text-center">

                <h1 class="display-5">

                    ${emoji} ${data.label}

                </h1>

                <h3>

                    Confidence:
                    ${data.confidence}%

                </h3>

            </div>
        `;

        if(data.label === "Phishing"){

            html += `
                <div class="phishing-warning">

                    ⚠️ SECURITY ALERT

                    <br><br>

                    Someone may be trying
                    to steal your password,
                    banking information,
                    or personal data.

                </div>
            `;
        }

        html += `
            <h2 class="section-title mt-5">

                Category Scores

            </h2>
        `;

        const categories = [
            "Business",
            "Personal",
            "Phishing",
            "Spam"
        ];

        categories.forEach(category => {

            const score =
                data.all_scores[category] || 0;

            let color = "bg-primary";

            if(category === "Spam")
                color = "bg-danger";

            if(category === "Phishing")
                color = "bg-warning";

            if(category === "Business")
                color = "bg-primary";

            if(category === "Personal")
                color = "bg-success";

            html += `
                <div class="mb-4">

                    <div class="score-label">

                        ${category}

                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar ${color}
                            progress-bar-striped
                            progress-bar-animated"

                            style="width:${score}%">

                            ${score}%

                        </div>

                    </div>

                </div>
            `;
        });

        html += `
            <h2 class="section-title mt-5">

                Extracted Text

            </h2>

            <div class="text-box">

                ${data.extracted_text
                    .replace(/\n/g,"<br>")}

            </div>
        `;

        document
            .getElementById("result")
            .innerHTML = html;

    }

    catch(error){

        document
            .getElementById("loading")
            .classList.add("d-none");

        console.error(error);

        alert(
            "An error occurred while analyzing the image."
        );
    }
}

</script>

</body>
</html>
